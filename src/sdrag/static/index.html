<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Self-Driving Papers QA</title>
<style>
  :root { --bg: #fafaf9; --fg: #1c1917; --muted: #78716c; --card: #fff; --line: #e7e5e4; --accent: #2563eb; --err: #b91c1c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0c0a09; --fg: #f5f5f4; --muted: #a8a29e; --card: #1c1917; --line: #292524; --accent: #60a5fa; --err: #f87171; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 40px 16px 64px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  form { display: flex; gap: 8px; flex-wrap: wrap; }
  textarea { flex: 1 1 100%; min-height: 84px; padding: 12px; font: inherit; color: var(--fg); background: var(--card);
             border: 1px solid var(--line); border-radius: 8px; resize: vertical; }
  button { padding: 10px 18px; font: inherit; font-weight: 600; color: #fff; background: var(--accent); border: 0; border-radius: 8px; cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  .examples { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 0; }
  .examples button { background: transparent; color: var(--accent); border: 1px solid var(--line); font-weight: 400; font-size: .9rem; padding: 6px 10px; }
  .status { color: var(--muted); margin: 20px 0 0; min-height: 1.5em; }
  .status.err { color: var(--err); }
  .answer { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin-top: 16px; white-space: pre-wrap; }
  a { color: var(--accent); }
  h2 { font-size: 1rem; margin: 28px 0 8px; }
  ol { padding-left: 20px; margin: 0; }
  li { margin: 0 0 12px; }
  .meta { color: var(--muted); font-size: .85rem; }
  details summary { cursor: pointer; color: var(--muted); font-size: .85rem; }
  details p { font-size: .9rem; margin: 6px 0 0; white-space: pre-wrap; }
  footer { color: var(--muted); font-size: .85rem; margin-top: 40px; }
</style>
</head>
<body>
<main>
  <h1>Self-Driving Papers QA</h1>
  <p class="sub">Ask a question about autonomous-driving research. Answers come only from 517 arXiv papers and cite them.</p>
  <form id="f">
    <textarea id="q" maxlength="1000" placeholder="e.g. Which sensors are fused for 3D object detection?" required></textarea>
    <button id="go" type="submit">Ask</button>
  </form>
  <div class="examples" id="ex">
    <button type="button">Which sensors are fused for 3D object detection?</button>
    <button type="button">How is trajectory prediction evaluated?</button>
    <button type="button">What simulators are used to test driving policies?</button>
  </div>
  <p class="status" id="status"></p>
  <div id="out"></div>
  <footer>Retrieval: local BGE embeddings over Chroma &middot; answers: gpt-5-mini &middot; <a href="/docs">API docs</a></footer>
</main>
<script>
const $ = (id) => document.getElementById(id);
const abs = (id) => "https://arxiv.org/abs/" + id;

function link(id) {
  const a = document.createElement("a");
  a.href = abs(id); a.target = "_blank"; a.rel = "noopener"; a.textContent = id;
  return a;
}

// answer text with [arxiv_id] citations turned into links (built as DOM nodes, never innerHTML)
function renderAnswer(text) {
  const box = document.createElement("div");
  box.className = "answer";
  const re = /\[(\d{4}\.\d{4,5}(?:v\d+)?)\]/g;
  let last = 0, m;
  while ((m = re.exec(text))) {
    box.append(text.slice(last, m.index), "[", link(m[1]), "]");
    last = re.lastIndex;
  }
  box.append(text.slice(last));
  return box;
}

function renderSources(sources) {
  const frag = document.createDocumentFragment();
  const h = document.createElement("h2"); h.textContent = "Retrieved excerpts"; frag.append(h);
  const ol = document.createElement("ol");
  for (const s of sources) {
    const li = document.createElement("li");
    li.append(link(s.arxiv_id), " " + (s.title || ""));
    const meta = document.createElement("div"); meta.className = "meta";
    meta.textContent = "chunk " + s.chunk + " · similarity " + (s.score ?? 0).toFixed(3);
    const d = document.createElement("details");
    const sum = document.createElement("summary"); sum.textContent = "show excerpt";
    const p = document.createElement("p"); p.textContent = s.text;
    d.append(sum, p); li.append(meta, d); ol.append(li);
  }
  frag.append(ol);
  return frag;
}

async function ask(question) {
  $("go").disabled = true; $("out").replaceChildren();
  $("status").className = "status";
  $("status").textContent = "Searching papers… (the first question after a quiet period can take ~20 s while the server wakes up)";
  try {
    const r = await fetch("/query", { method: "POST", headers: { "Content-Type": "application/json" },
                                      body: JSON.stringify({ question }) });
    const body = await r.json().catch(() => ({}));
    if (!r.ok) {
      const msg = { 402: "The demo's answer budget is used up, so new questions are paused.",
                    429: "Too many questions right now. Please try again in a minute.",
                    422: "Please enter a question of at least 3 characters." }[r.status];
      throw new Error(msg || body.detail || "Request failed (" + r.status + ")");
    }
    $("status").textContent = "";
    $("out").append(renderAnswer(body.answer), renderSources(body.sources));
  } catch (e) {
    $("status").className = "status err"; $("status").textContent = e.message;
  } finally {
    $("go").disabled = false;
  }
}

$("f").addEventListener("submit", (e) => { e.preventDefault(); const q = $("q").value.trim(); if (q) ask(q); });
$("ex").addEventListener("click", (e) => {
  if (e.target.tagName === "BUTTON") { $("q").value = e.target.textContent; ask(e.target.textContent); }
});
</script>
</body>
</html>
