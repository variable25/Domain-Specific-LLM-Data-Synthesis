services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sdrag
      POSTGRES_PASSWORD: sdrag
      POSTGRES_DB: sdrag
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sdrag"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
